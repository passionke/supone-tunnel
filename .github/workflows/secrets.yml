# author: kejiqing
# PR / 合入 main 扫密钥；不打包。发版仍只走 release.yml 的 v* tag。
name: secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree
        # 只扫当前树，避免历史已泄露 commit 永久卡死 CI；新泄露靠本检查 + pre-commit。
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --verbose --redact
