# author: kejiqing
# GitHub windows-latest 打 Windows 安装包；ECS 只做装包冒烟，不在此编。
name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ui/profile-active-cst
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        shell: bash
        run: |
          npm ci
          npm ci --prefix ui

      - name: Tauri build (NSIS)
        shell: bash
        env:
          REGION: else
        run: npm run build -- --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: supone-tunnel-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
